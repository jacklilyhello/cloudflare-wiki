name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-wiki-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'jacklilyhello/cloudflare-wiki' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-production-run.yml
    # Runtime secret arguments mask Repository Variables before the runner logs
    # step environments. No additional persistent secret or GitHub token is used.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WIKI_BRAND_MANIFEST: ${{ vars.WIKI_BRAND_MANIFEST }}
      WIKI_BRAND_LOGO_LIGHT_B64: ${{ vars.WIKI_BRAND_LOGO_LIGHT_B64 }}
      WIKI_BRAND_LOGO_DARK_B64: ${{ vars.WIKI_BRAND_LOGO_DARK_B64 }}
      WIKI_BRAND_FAVICON_B64: ${{ vars.WIKI_BRAND_FAVICON_B64 }}
      WIKI_BRAND_APPLE_TOUCH_B64: ${{ vars.WIKI_BRAND_APPLE_TOUCH_B64 }}
      WIKI_BRAND_OG_IMAGE_B64: ${{ vars.WIKI_BRAND_OG_IMAGE_B64 }}
