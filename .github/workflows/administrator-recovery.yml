name: Administrator Recovery

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read the credential version, or apply the protected recovery Secret
        type: choice
        options: [status, apply]
        default: status
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-cloudflare-wiki-test
  cancel-in-progress: false

jobs:
  recovery:
    if: github.repository == 'jacklilyhello/cloudflare-wiki' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: administrator-recovery
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Reject stale main recovery
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
      - name: Recover only the original administrator
        run: node scripts/administrator-recovery.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_OPERATION: ${{ inputs.operation }}
          RECOVERY_ENVIRONMENT: administrator-recovery
          ADMIN_RECOVERY_BUNDLE: ${{ secrets.ADMIN_RECOVERY_BUNDLE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          TEST_DOMAIN: ${{ vars.TEST_DOMAIN }}
