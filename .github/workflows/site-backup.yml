name: Site Backup

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Create a private backup, or restore the latest backup in an isolated local emulator
        type: choice
        options: [backup, verify-latest]
        default: backup
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-wiki-production
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository == 'jacklilyhello/cloudflare-wiki' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Reject stale main backup
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
      - name: Private backup and isolated restore verification
        run: node scripts/site-backup.mjs
        env:
          WRANGLER_SEND_METRICS: "false"
          BACKUP_OPERATION: ${{ inputs.operation || 'backup' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
      - name: Report failed backup
        if: failure()
        run: echo '::error::Backup or isolated restore failed. Review this failed Actions run; no remote restore or automatic retry was performed.'
